name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: dailycheckin

jobs:
  # Job 1: Quality Gate & Automated Tests
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Frontend Code Quality, Tests & Production Bundle (must run before Go vet/test due to embed.go)
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Go Format & Vet
        run: |
          test -z "$(gofmt -l internal/ cmd/)" || (echo "Unformatted Go files detected" && exit 1)
          go vet ./...

      - name: Start Firestore Emulator
        run: |
          docker run -d --name firestore-emulator -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8085
          for i in $(seq 1 30); do
            if curl -s http://localhost:8085 >/dev/null 2>&1; then
              echo "Firestore emulator is ready"
              exit 0
            fi
            sleep 1
          done
          docker logs firestore-emulator
          exit 1

      - name: Run Backend Unit & Integration Tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        run: |
          go test -v -race ./...

      - name: Verify Go Single-Binary Embedding
        run: |
          go build -ldflags="-s -w" -o bin/dailycheckin ./cmd/server
          ls -lh bin/dailycheckin

  # Job 2: Multi-Stage Docker Packaging & Health Check
  docker-package:
    name: Build & Audit Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Footprint (<45MB)
        run: |
          IMAGE_SIZE_BYTES=$(docker inspect ${{ env.IMAGE_NAME }}:latest --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))
          echo "Built Docker Image Size: ${IMAGE_SIZE_MB}MB"
          if [ "$IMAGE_SIZE_MB" -gt 45 ]; then
            echo "Error: Image size ${IMAGE_SIZE_MB}MB exceeds 45MB threshold!"
            exit 1
          fi

      - name: Test Container Health Check & Startup
        run: |
          docker run -d --name test-container -p 8080:8080 \
            -e FIRESTORE_EMULATOR_HOST=localhost:8085 \
            ${{ env.IMAGE_NAME }}:latest
          sleep 4
          curl -f http://localhost:8080/api/health || (docker logs test-container && exit 1)
          docker stop test-container

  # Job 3: Deploy to Google Cloud Run (Production)
  deploy:
    name: Deploy to Production
    needs: [test, docker-package]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Production Container
        run: |
          IMAGE_TAG="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build \
            --build-arg VITE_FIREBASE_API_KEY="${{ vars.VITE_FIREBASE_API_KEY }}" \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN="${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}" \
            --build-arg VITE_FIREBASE_PROJECT_ID="${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --image "$IMAGE_TAG" \
            --region "${{ vars.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "APP_ENV=production,FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}"

      - name: Deploy Firestore Rules & Indexes
        run: |
          npx --yes firebase-tools deploy \
            --only firestore \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Verify Live Health Endpoint
        run: |
          SERVICE_URL=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Production URL: $SERVICE_URL"
          curl -f "${SERVICE_URL}/api/health"
