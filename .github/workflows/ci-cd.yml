name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: dailycheckin
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: dailycheckin

jobs:
  # Job 1: Quality Gate & Automated Tests
  test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      firestore-emulator:
        image: google/cloud-sdk:alpine
        ports:
          - 8085:8085
        options: >-
          --entrypoint /bin/sh
        env:
          CLOUDSDK_CORE_PROJECT: test-project
        # Start firestore emulator inside container
        args:
          - -c
          - "gcloud components install cloud-firestore-emulator --quiet && gcloud beta emulators firestore start --host-port=0.0.0.0:8085"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      # Backend Code Quality & Tests
      - name: Go Format & Vet
        run: |
          test -z "$(gofmt -l internal/ cmd/)" || (echo "Unformatted Go files detected" && exit 1)
          go vet ./...

      - name: Run Backend Unit & Integration Tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8085
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
        run: |
          go test -v -race ./...

      # Frontend Code Quality & Tests
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Go Single-Binary Embedding
        run: |
          go build -ldflags="-s -w" -o bin/dailycheckin ./cmd/server
          ls -lh bin/dailycheckin

  # Job 2: Multi-Stage Docker Packaging & Security Audit
  docker-package:
    name: Build & Audit Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Footprint (<45MB)
        run: |
          IMAGE_SIZE_BYTES=$(docker inspect ${{ env.IMAGE_NAME }}:latest --format='{{.Size}}')
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))
          echo "Built Docker Image Size: ${IMAGE_SIZE_MB}MB"
          if [ "$IMAGE_SIZE_MB" -gt 45 ]; then
            echo "Error: Image size ${IMAGE_SIZE_MB}MB exceeds 45MB threshold!"
            exit 1
          fi

      - name: Test Container Health Check & Startup
        run: |
          docker run -d --name test-container -p 8080:8080 ${{ env.IMAGE_NAME }}:latest
          sleep 4
          curl -f http://localhost:8080/api/health || (docker logs test-container && exit 1)
          docker stop test-container

  # Job 3: Google Cloud Run Deployment (Runs only on tags or main push with GCP credentials)
  deploy:
    name: Deploy to Google Cloud Run
    needs: [test, docker-package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: env.GCP_SA_KEY != ''
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Production Container
        if: env.GCP_SA_KEY != ''
        run: |
          IMAGE_TAG="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/dailycheckin/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image "$IMAGE_TAG" \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated
